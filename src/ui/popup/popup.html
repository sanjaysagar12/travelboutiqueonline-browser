<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBO Interceptor</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="app-header">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M22 16.5v-2l-8.5-5V5a1.5 1.5 0 0 0-3 0v4.5L2 14.5v2l8.5-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13.5 19v-5.5z" />
                </svg>
            </span>
            <span class="brand-title">TBO Interceptor</span>
        </div>
    </header>

    <section class="status-card">
        <div class="status-row">
            <span id="statusDot" class="status-dot status-idle" aria-hidden="true"></span>
            <span id="statusText" class="status-text">Waiting for traffic&hellip;</span>
        </div>
        <div class="stats-row">
            <div class="stat">
                <span class="stat-label">Pages</span>
                <span id="pageCount" class="stat-value">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
                <span class="stat-label">Updated</span>
                <span id="lastTime" class="stat-value">&ndash;</span>
            </div>
        </div>
    </section>

    <p class="hint">Browse to a flight search result, wait for the request to be captured, then press Start.</p>

    <section class="toolbar" role="toolbar" aria-label="Scraper actions">
        <button id="startBtn" class="icon-btn icon-btn-primary" title="Start scraping" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3" />
            </svg>
            <span class="btn-label">Start</span>
        </button>
        <button id="stopBtn" class="icon-btn icon-btn-danger" title="Stop scraping" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="5" width="14" height="14" rx="2" />
            </svg>
            <span class="btn-label">Stop</span>
        </button>
        <button id="clearBtn" class="icon-btn" title="Reset and clear captured data">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
            <span class="btn-label">Clear</span>
        </button>
        <button id="downloadHtmlBtn" class="icon-btn" title="Download current page HTML">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span class="btn-label">HTML</span>
        </button>
    </section>

    <footer class="app-footer">
        <span class="footer-endpoint">flights-api.tbo.in/api/v1/flights/search</span>
    </footer>

    <script src="popup.js"></script>
</body>

</html>
