<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flight Data Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="container">
        <!-- Header: Centered Route and Date -->
        <div class="header">
            <div id="routeDisplay" class="route">
                Loading Route...
            </div>
            <div class="date-divider"></div>
            <div id="dateDisplay" class="date">
                Loading Date...
            </div>
        </div>

        <!-- Controls: Markup, Themes, and Export -->
        <div class="controls">
            <div class="control-group" id="markupControl">
                <span class="control-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="5" x2="5" y2="19" />
                        <circle cx="6.5" cy="6.5" r="2.5" />
                        <circle cx="17.5" cy="17.5" r="2.5" />
                    </svg>
                </span>
                <label for="globalMarkup">Markup</label>
                <input type="number" id="globalMarkup" class="control-input" value="0" placeholder="0.00"
                    title="Global Markup">
                <button id="btnApplyGlobal" class="btn btn-sm">Apply All</button>
            </div>

            <div class="control-divider" aria-hidden="true"></div>

            <div class="control-group" id="colMarkupControl">
                <div class="dropdown-wrap">
                    <button type="button" id="colSelectBtn" class="btn btn-outline btn-select" aria-haspopup="listbox"
                        aria-expanded="false">
                        <span id="colSelectLabel">Select Column</span>
                        <svg class="btn-svg btn-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                    <div id="colSelectMenu" class="dropdown-menu hidden" role="listbox">
                        <div id="colSelectList" class="dropdown-content">
                            <!-- Fare column options generated dynamically -->
                        </div>
                    </div>
                </div>
                <input type="number" id="colMarkup" class="control-input" value="0" placeholder="0.00">
                <button id="btnApplyCol" class="btn btn-sm btn-outline">Apply</button>
            </div>

            <div class="control-divider" aria-hidden="true"></div>

            <div class="control-group">
                <div class="dropdown-wrap">
                    <button type="button" id="btnToggleDesign" class="btn btn-icon btn-outline"
                        title="Design &amp; display options" aria-haspopup="true" aria-expanded="false">
                        <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12 2a10 10 0 1 0 0 20c1.4 0 2-1 2-2 0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H16a4 4 0 0 0 4-4c0-5.4-3.6-9.5-8-9.5z" />
                            <circle cx="7.5" cy="10.5" r="1.1" fill="currentColor" stroke="none" />
                            <circle cx="10.5" cy="7" r="1.1" fill="currentColor" stroke="none" />
                            <circle cx="15" cy="8" r="1.1" fill="currentColor" stroke="none" />
                        </svg>
                        Design
                        <svg class="btn-svg btn-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                    <div id="designDropdown" class="dropdown-menu design-menu hidden">
                        <div class="dropdown-content design-content">
                            <div class="design-row">
                                <span class="design-label">Airline Icons</span>
                                <label class="switch" title="Toggle airline icons">
                                    <input type="checkbox" id="chkShowIcons" checked>
                                    <span class="switch-track"><span class="switch-thumb"></span></span>
                                </label>
                            </div>

                            <div class="design-divider"></div>

                            <div class="design-row">
                                <span class="design-label">Column Size</span>
                                <div class="stepper">
                                    <button type="button" id="btnDensityDown" class="stepper-btn"
                                        title="Reduce column size">&minus;</button>
                                    <span id="densityValue" class="stepper-value">100%</span>
                                    <button type="button" id="btnDensityUp" class="stepper-btn"
                                        title="Increase column size">+</button>
                                </div>
                            </div>

                            <div class="design-divider"></div>

                            <div class="design-font-group" data-target="header">
                                <div class="design-font-title">Header Font</div>
                                <div class="design-row">
                                    <label class="mini-check">
                                        <input type="checkbox" class="fontBoldToggle" data-target="header"> Bold
                                    </label>
                                    <div class="stepper">
                                        <button type="button" class="fontSizeDown" data-target="header"
                                            title="Smaller">&minus;</button>
                                        <span class="fontSizeValue" data-target="header">20px</span>
                                        <button type="button" class="fontSizeUp" data-target="header"
                                            title="Larger">+</button>
                                    </div>
                                </div>
                            </div>

                            <div class="design-font-group" data-target="colHeader">
                                <div class="design-font-title">Column Header Font</div>
                                <div class="design-row">
                                    <label class="mini-check">
                                        <input type="checkbox" class="fontBoldToggle" data-target="colHeader"> Bold
                                    </label>
                                    <div class="stepper">
                                        <button type="button" class="fontSizeDown" data-target="colHeader"
                                            title="Smaller">&minus;</button>
                                        <span class="fontSizeValue" data-target="colHeader">14px</span>
                                        <button type="button" class="fontSizeUp" data-target="colHeader"
                                            title="Larger">+</button>
                                    </div>
                                </div>
                            </div>

                            <div class="design-font-group" data-target="colData">
                                <div class="design-font-title">Column Data Font</div>
                                <div class="design-row">
                                    <label class="mini-check">
                                        <input type="checkbox" class="fontBoldToggle" data-target="colData"> Bold
                                    </label>
                                    <div class="stepper">
                                        <button type="button" class="fontSizeDown" data-target="colData"
                                            title="Smaller">&minus;</button>
                                        <span class="fontSizeValue" data-target="colData">13px</span>
                                        <button type="button" class="fontSizeUp" data-target="colData"
                                            title="Larger">+</button>
                                    </div>
                                </div>
                            </div>

                            <div class="design-divider"></div>
                            <button type="button" id="btnResetDesign" class="btn btn-sm btn-outline"
                                style="width: 100%;">Reset to Default</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <button id="btnToggleTheme" class="btn btn-icon btn-outline" title="Switch color theme">
                    <span id="themeSwatch" class="theme-swatch" aria-hidden="true"></span>
                    Theme: <span id="currentThemeLabel">Blue</span>
                </button>
            </div>

            <div class="control-group last">
                <div class="dropdown-wrap">
                    <button id="btnToggleDisplay" class="btn btn-icon btn-outline" title="Choose visible columns">
                        <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="7" height="16" rx="1" />
                            <rect x="14" y="4" width="7" height="16" rx="1" />
                        </svg>
                        Display
                        <svg class="btn-svg btn-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                    <div id="displayDropdown" class="dropdown-menu hidden">
                        <div id="columnChecklist" class="dropdown-content">
                            <!-- Checkboxes generated dynamically -->
                        </div>
                        <div class="dropdown-footer">
                            <button id="btnSaveDisplay" class="btn success" style="width: 100%;">Save
                                Changes</button>
                        </div>
                    </div>
                </div>
                <button id="btnCopyEmail" class="btn btn-icon btn-outline" title="Copy table for email">
                    <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2" />
                        <polyline points="3 7 12 13 21 7" />
                    </svg>
                    Email
                </button>
                <button id="btnDownloadCsv" class="btn btn-icon success" title="Download results as CSV">
                    <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    CSV
                </button>
            </div>
        </div>

        <!-- Table: Compact Spaced Row Layout -->
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr id="tableHead">
                        <!-- Headers generated dynamically -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data rows generated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
